[build]
  # Install from repo root (resolves workspaces), then run Vite directly.
  # Using 'npx vite build' bypasses turbo entirely — no turbo.json needed.
  command = "npm install && cd apps/web && npx vite build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# SPA catch-all: rewrite every path to index.html so React Router handles routing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
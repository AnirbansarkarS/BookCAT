[build]
  command = "npm install --legacy-peer-deps && npm --prefix apps/web run build"
  publish = "apps/web/dist"
  base = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# SPA catch-all: rewrite every path to index.html so React Router handles routing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200